<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andrey Graphics Inc.</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.08), transparent 30%),
        linear-gradient(135deg, #111111, #1b1b1b 55%, #0d0d0d);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    .card {
      width: 100%;
      max-width: 980px;
      padding: 80px 60px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      text-align: center;
    }

    .company {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #bdbdbd;
      margin-bottom: 24px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      font-weight: 700;
      margin-bottom: 24px;
      letter-spacing: -2px;
    }

    .headline {
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 400;
      color: #e4e4e4;
      margin-bottom: 22px;
    }

    .description {
      max-width: 650px;
      margin: 0 auto 42px;
      font-size: 18px;
      line-height: 1.7;
      color: #bdbdbd;
    }

    .contact {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .primary {
      background: #ffffff;
      color: #111111;
    }

    .primary:hover {
      transform: translateY(-2px);
      background: #eeeeee;
    }

    .secondary {
      border: 1px solid rgba(255,255,255,0.3);
      color: #ffffff;
      background: transparent;
    }

    .secondary:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.08);
    }

    .info {
      margin-top: 48px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.12);
      color: #bdbdbd;
      line-height: 2;
      font-size: 16px;
    }

    .info a {
      color: #ffffff;
      text-decoration: none;
    }

    .info a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px;
      }

      .card {
        padding: 55px 24px;
        border-radius: 20px;
      }

      h1 {
        letter-spacing: -1px;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="company">Andrey Graphics Inc.</div>

    <h1>Design That Makes an Impression.</h1>

    <div class="headline">
      Graphic Design and Branding Services
    </div>

    <p class="description">
      Professional graphic design and branding solutions for businesses
      and individuals.
    </p>

    <div class="contact">
      <a class="button primary" href="tel:+18184540157">
        Call Now
      </a>

      <a class="button secondary" href="mailto:andreygraphics1@gmail.com">
        Email Us
      </a>
    </div>

    <div class="info">
      <div>
        Phone:
        <a href="tel:+18184540157">818-454-0157</a>
      </div>

      <div>
        Email:
        <a href="mailto:andreygraphics1@gmail.com">
          andreygraphics1@gmail.com
        </a>
      </div>
    </div>
  </main>
</body>
</html>
