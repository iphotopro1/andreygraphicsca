<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andrey Graphics Inc.</title>
  <meta name="description" content="Andrey Graphics Inc. — Graphic Design and Branding Services.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at 15% 20%, rgba(120, 92, 255, 0.22), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(0, 190, 255, 0.18), transparent 26%),
        radial-gradient(circle at 50% 85%, rgba(255, 80, 140, 0.10), transparent 28%),
        linear-gradient(135deg, #05070c 0%, #0a0f18 45%, #06090f 100%);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 95%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 28px 0;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .brand span {
      color: #a89cff;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 64px;
      align-items: center;
      padding: 42px 0 70px;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 22px;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #d9d3ff;
      background: rgba(145, 125, 255, 0.08);
      border: 1px solid rgba(145, 125, 255, 0.22);
    }

    h1 {
      font-size: clamp(58px, 7vw, 104px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      margin-bottom: 26px;
      max-width: 760px;
    }

    .accent {
      background: linear-gradient(90deg, #ffffff 0%, #c4b7ff 48%, #7edcff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .subheadline {
      font-size: clamp(24px, 2.8vw, 34px);
      color: #e6e9ef;
      margin-bottom: 34px;
      font-weight: 500;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 0 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .btn-primary {
      background: #ffffff;
      color: #111318;
      box-shadow: 0 12px 34px rgba(255,255,255,0.10);
    }

    .btn-secondary {
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .right-side {
      position: relative;
      min-height: 560px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .frame {
      width: 100%;
      max-width: 470px;
      min-height: 520px;
      border-radius: 30px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.02)),
        linear-gradient(135deg, rgba(96, 72, 255, 0.18), rgba(0, 181, 255, 0.10));
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 90px rgba(0,0,0,0.40);
      padding: 28px;
    }

    .frame::before {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
      top: -180px;
      right: -160px;
    }

    .frame::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
      bottom: -170px;
      left: -120px;
    }

    .mini-bar {
      width: 96px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #9f8cff, #56ccff);
      margin-bottom: 26px;
    }

    .panel {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 18px;
      margin-top: 18px;
    }

    .card {
      border-radius: 22px;
      padding: 22px;
      background: rgba(8, 12, 20, 0.62);
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }

    .card-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: #8f98a7;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      color: #ffffff;
    }

    .lines {
      display: grid;
      gap: 12px;
      margin-top: 6px;
    }

    .line {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.24), rgba(255,255,255,0.06));
    }

    .line.short {
      width: 60%;
    }

    .contact-card a {
      display: block;
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: 700;
      margin-top: 12px;
    }

    footer {
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 24px 0 32px;
      color: #7f8793;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .right-side {
        min-height: auto;
      }

      .frame {
        min-height: 460px;
      }
    }

    @media (max-width: 600px) {
      .page {
        width: min(100% - 24px, 1180px);
      }

      header {
        padding: 20px 0;
      }

      .brand {
        font-size: 15px;
      }

      h1 {
        font-size: 58px;
      }

      .subheadline {
        font-size: 23px;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .frame {
        padding: 20px;
        border-radius: 22px;
        min-height: 420px;
      }

      .card-title {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header>
      <div class="brand">
        ANDREY GRAPHICS <span>INC.</span>
      </div>
    </header>

    <main>
      <section>
        <div class="eyebrow">
          Graphic Design & Branding
        </div>

        <h1>
          Design that
          <span class="accent">builds brands.</span>
        </h1>

        <div class="subheadline">
          Graphic Design and Branding Services
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="tel:+18184540157">
            Call 818-454-0157
          </a>

          <a class="btn btn-secondary" href="mailto:andreygraphics1@gmail.com">
            Email Us
          </a>
        </div>
      </section>

      <section class="right-side">
        <div class="frame">
          <div class="mini-bar"></div>

          <div class="panel">

            <div class="card">
              <div class="card-label">Studio</div>
              <div class="card-title">
                Andrey Graphics Inc.
              </div>
            </div>

            <div class="card">
              <div class="card-label">Focus</div>
              <div class="card-title">
                Graphic Design & Brand Identity
              </div>

              <div class="lines">
                <div class="line"></div>
                <div class="line short"></div>
              </div>
            </div>

            <div class="card contact-card">
              <div class="card-label">Contact</div>

              <a href="tel:+18184540157">
                818-454-0157
              </a>

              <a href="mailto:andreygraphics1@gmail.com">
                andreygraphics1@gmail.com
              </a>
            </div>

          </div>
        </div>
      </section>
    </main>

    <footer>
      © 2026 Andrey Graphics Inc.
    </footer>

  </div>
</body>
</html>
